[project]
name = "personal-finance-ingest"
version = "0.1.0"
description = "Mercado Pago statement ingest → categorization → Google Sheets, with MCP tools for agentic control"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pymupdf>=1.24.0",
  "pydantic>=2.0",
  "mcp>=1.0",
]

[project.optional-dependencies]
sheets = [
  "google-api-python-client>=2.100.0",
  "google-auth>=2.0",
  "google-auth-oauthlib>=1.0",
]
dev = [
  "pytest>=8.0",
]

[project.scripts]
finance = "finance_ingest.cli:main"
finance-mcp = "finance_ingest.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finance_ingest"]

[tool.hatch.build.targets.sdist]
include = ["src/finance_ingest", "tests", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
