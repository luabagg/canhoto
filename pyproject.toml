[project]
name = "canhoto"
version = "0.1.0"
description = "Canhoto — local statement → ledger → categorize → summary PDF engine (CLI + MCP)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Canhoto contributors" }]
keywords = ["finance", "ledger", "mcp", "cli", "pdf"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial",
]
dependencies = [
  "pymupdf>=1.24.0",
  "pydantic>=2.0",
  "mcp>=1.0",
  "fpdf2>=2.8.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.10",
]
# Legacy Google Sheets path is intentionally NOT a default extra.
# A future exporter plugin may reintroduce Sheets outside core.

[project.scripts]
canhoto = "canhoto.cli:main"
canhoto-mcp = "canhoto.mcp.server:main"

[project.urls]
Homepage = "https://github.com/luanbaggio/canhoto"
Documentation = "https://github.com/luanbaggio/canhoto/blob/main/docs/ARCHITECTURE.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canhoto"]

[tool.hatch.build.targets.sdist]
include = [
  "src/canhoto",
  "tests",
  "examples",
  "docs",
  "README.md",
  "AGENTS.md",
  "STATUS.md",
  "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
  "error::DeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src/canhoto", "tests"]
extend-exclude = ["src/finance_ingest", "examples", ".venv", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["canhoto"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
exclude = ["src/finance_ingest/"]
