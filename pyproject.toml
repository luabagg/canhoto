[project]
name = "canhoto"
version = "0.2.0"
description = "Local bank statement ledger: parse, categorize, and export monthly PDF summaries (CLI and MCP)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "luabagg" }]
keywords = ["finance", "ledger", "mcp", "cli", "pdf"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial",
]
dependencies = [
  "pymupdf>=1.24.0",
  "pydantic>=2.0",
  "mcp>=1.0",
  "fpdf2>=2.8.7",
  "alembic>=1.19.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.10",
]

[project.scripts]
canhoto = "canhoto.cli:main"
canhoto-mcp = "canhoto.mcp.server:main"

[project.urls]
Homepage = "https://github.com/luabagg/canhoto"
Documentation = "https://github.com/luabagg/canhoto/blob/main/README.md"
Issues = "https://github.com/luabagg/canhoto/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canhoto"]

[tool.hatch.build.targets.sdist]
include = [
  "src/canhoto",
  "tests",
  "examples",
  "README.md",
  "LICENSE",
  "AGENTS.md",
  "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
  "error::DeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src/canhoto", "tests"]
extend-exclude = ["examples", ".venv", "dist", "src/canhoto/migrations/script.py.mako"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["canhoto"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
