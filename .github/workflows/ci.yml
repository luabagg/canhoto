name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Sync project (dev extras)
        run: uv sync --extra dev

      - name: Ruff
        run: uv run ruff check src/canhoto tests

      - name: Mypy
        run: uv run mypy -p canhoto

      - name: Pytest (incl. guardrails)
        run: uv run pytest -q

      - name: Console scripts present
        run: |
          uv run canhoto --help
          uv run python -c "import canhoto.mcp.server as s; assert callable(s.main)"
